<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebXR — белая сфера</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: sans-serif;
    }

    canvas {
      display: block;
    }

    #start {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 20px;
      font-size: 18px;
      z-index: 1;
    }

    #message {
      position: fixed;
      left: 50%;
      top: calc(50% + 45px);
      transform: translateX(-50%);
      color: #333;
      text-align: center;
      z-index: 1;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <button id="start">Запустить AR</button>
  <div id="message"></div>

  <script type="module">
    import * as THREE from "three";

    const startButton = document.querySelector("#start");
    const message = document.querySelector("#message");

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    const renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType("local");

    document.body.appendChild(renderer.domElement);

    // Сфера диаметром 30 см, в 1 метре перед начальной позицией.
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 48, 32),
      new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.85,
        metalness: 0
      })
    );
    sphere.position.set(0, 0, -1);
    scene.add(sphere);

    // Невидимое освещение: оно только создаёт объёмное затенение на сфере.
    scene.add(new THREE.HemisphereLight(0xffffff, 0x303038, 1.2));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2);
    keyLight.position.set(-0.5, 1, 0.5);
    scene.add(keyLight);

    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });

    startButton.addEventListener("click", async () => {
      if (!navigator.xr) {
        message.textContent = "WebXR не поддерживается этим браузером.";
        return;
      }

      try {
        const supported =
          await navigator.xr.isSessionSupported("immersive-ar");

        if (!supported) {
          message.textContent =
            "На этом устройстве режим immersive-ar недоступен.";
          return;
        }

        const session = await navigator.xr.requestSession("immersive-ar", {
          requiredFeatures: ["local"]
        });

        await renderer.xr.setSession(session);
        startButton.hidden = true;
        message.hidden = true;

        session.addEventListener("end", () => {
          startButton.hidden = false;
          message.hidden = false;
        });
      } catch (error) {
        message.textContent = `Не удалось запустить AR: ${error.message}`;
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
