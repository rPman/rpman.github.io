<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WebXR — Белый шар</title>
    <style>
        body { margin: 0; background: #000; }
        button {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<button id="btn">Войти в VR</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x888888);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);

// Белый шар
const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 64, 64),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, metalness: 0.0 })
);
sphere.position.set(0, 1.5, -1.5);
scene.add(sphere);

// Невидимое освещение (даёт тень/затемнение на шаре)
const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(2, 4, 3);
scene.add(light);

// Лёгкий ambient, чтобы тёмная сторона не была абсолютно чёрной
scene.add(new THREE.AmbientLight(0xffffff, 0.3));

// Кнопка входа
document.getElementById('btn').addEventListener('click', async () => {
    const session = await navigator.xr.requestSession('immersive-vr', {
        optionalFeatures: ['local-floor']
    });
    renderer.xr.setSession(session);
});

renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
</body>
</html>
